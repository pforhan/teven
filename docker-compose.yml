services:
  db:
    image: postgres:16-alpine
    container_name: teven_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${TEVEN_POSTGRES_DB:-teven_db}
      POSTGRES_USER: ${TEVEN_POSTGRES_USER:-teven_user}
      POSTGRES_PASSWORD: ${TEVEN_POSTGRES_PASSWORD:-teven_password}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TEVEN_POSTGRES_USER:-teven_user} -d ${TEVEN_POSTGRES_DB:-teven_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Which web bundle to compile into the backend jar: `react` (the live
        # app until Phase 10) or `flutter`. Both pipelines stay buildable during
        # the migration; the unselected one is never built.
        # Override with WEB_SOURCE=flutter docker compose up --build
        WEB_SOURCE: ${WEB_SOURCE:-react}
        # The flutter variant does NOT build inside Docker: it copies a
        # prebuilt bundle. Run this first, or the build fails:
        #   (cd flutter_app && flutter build web --release --no-web-resources-cdn)
    container_name: teven_backend
    ports:
      - "${TEVEN_BACKEND_PORT:-2022}:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/${TEVEN_POSTGRES_DB:-teven_db}
      DB_USER: ${TEVEN_POSTGRES_USER:-teven_user}
      DB_PASSWORD: ${TEVEN_POSTGRES_PASSWORD:-teven_password}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      JWT_EXPIRATION_MILLIS: ${JWT_EXPIRATION_MILLIS}
      DEV_MODE: ${DEV_MODE:-false}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
